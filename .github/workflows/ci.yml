name: ci

# Public repo: calls the PUBLIC reusable. tatari-tv/github-actions is internal and
# a public repo cannot resolve reusable workflows/actions from it, so this uses the
# public twin tatari-tv/github-actions-public. CI = `otto ci` via rust-ci.yml@v2.4.2;
# the caller owns the trigger. The Rust toolchain and whitespace versions use the
# reusable's defaults. Release lives in release.yml (migrated separately).
on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  ci:
    uses: tatari-tv/github-actions-public/.github/workflows/rust-ci.yml@v2.4.2
