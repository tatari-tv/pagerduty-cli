# Sample configuration for pd (pagerduty-cli).
# Copy to ~/.config/pagerduty-cli/pagerduty-cli.yml and edit.
# CLI flags and env vars override anything set here.

# PagerDuty API token. Prefer the PAGERDUTY_API_TOKEN env var in shells;
# only set it here when the env var is awkward (e.g. cron jobs).
# WARNING: this is a plaintext secret. Never commit a filled-in value.
# api-token: <paste-token-here>

# Subdomain used to namespace the local name-to-ID cache.
# Set this to your PagerDuty subdomain (e.g. "mycompany" for mycompany.pagerduty.com).
# Omitting it is fine; the cache will use "default" as the namespace.
# subdomain: mycompany

# Default output format: auto | json | table.
# "auto" = table when stdout is a TTY, JSON when piped.
output-format: auto

# Log level: error | warn | info | debug | trace.
log-level: warn
