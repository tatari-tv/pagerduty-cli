[package]
name = "pagerduty-cli"
version = "0.6.6"
edition = "2024"
authors = ["Scott Idler <scott.idler@tatari.tv>"]
build = "build.rs"
description = "PagerDuty incident management CLI"

[[bin]]
name = "pd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
eyre = "0.6.12"
futures = "0.3.32"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.2", features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
terminal_size = "0.4.4"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "ansi"] }
[build-dependencies]

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"
