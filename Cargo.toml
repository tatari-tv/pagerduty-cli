[package]
name = "pagerduty-cli"
version = "0.1.0"
edition = "2024"
authors = ["Scott Idler <scott.idler@tatari.tv>"]
build = "build.rs"
description = "PagerDuty incident management CLI"

[[bin]]
name = "pd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
env_logger = "0.11.10"
eyre = "0.6.12"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.52.0", features = ["full"] }
[build-dependencies]
