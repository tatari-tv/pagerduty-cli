# WF2: Incident Visibility
#
# Cross-team visibility for standard (non-managed) incidents in #incidents.
# Replaces the per-service #inc-* Slack connections with a single workflow.
#
# Managed incidents already post to #incidents via WF1 (Action 6).
# This workflow catches everything else: lightweight notification, no Slack
# channel, no Jira ticket, no roles. Team handles via standard on-call.
#
# Action IDs are placeholders - resolve via: pd action list

workflow:
  name: Incident Visibility
  description: Post all non-managed incidents to #incidents for cross-team awareness
  is-enabled: false
  steps:
    - name: "Post to #incidents"
      action-id: pagerduty.slack.send-message
      inputs:
        - name: channel
          value: "#incidents"
        - name: message
          value: |
            :warning: *Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Service: {{incident.service.name}}
            PagerDuty: {{incident.html_url}}
            Assigned: {{incident.assignments[0].assignee.summary}}

trigger:
  trigger-type: conditional
  # Live-tested: not (...) is valid PCL syntax. != is also valid but not() is clearer for negation.
  condition: "not (incident.incident_type.name == 'Managed Incident')"
