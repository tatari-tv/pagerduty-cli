# WF2: Incident Visibility
#
# Cross-team visibility for base/major incidents in #incidents.
# Managed, Security, and Business incidents all have their own full-response
# workflows (WF1, WF5, WF6) that post to #incidents themselves. This workflow
# catches everything else with a lightweight notification.
#
# Trigger condition excludes all three full-response types to prevent
# duplicate #incidents posts.

workflow:
  name: Incident Visibility
  description: Post base and major incidents to #incidents for cross-team awareness
  is-enabled: false
  steps:
    - name: "Post to #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :warning: *Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Service: {{incident.service.name}}
            PagerDuty: {{incident.url}}
            Assigned: {{incident.assignments[0].assignee.summary}}

trigger:
  trigger-type: conditional
  condition: "incident.incident_type.name != 'Managed Incident' and incident.incident_type.name != 'Security Incident' and incident.incident_type.name != 'Business Incident'"
