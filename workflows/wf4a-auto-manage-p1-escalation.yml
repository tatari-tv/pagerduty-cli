# WF4a: Auto-Manage on P1 Escalation
#
# If any non-managed incident gets changed to P1, auto-manage it.
# Catches P4->P1, P3->P1, P2->P1 mid-flight escalations.
# WF1 then fires the full response on the managed incident.

workflow:
  name: Auto-Manage on P1 Escalation
  description: Auto-set managed when any incident is changed to P1
  is-enabled: false
  steps:
    - name: Set Incident Type
      action-id: pagerduty.com:incident-workflows:update-incident-type:1
      inputs:
        - name: Incident Type
          value: Managed Incident

trigger:
  trigger-type: conditional
  condition: "incident.priority.name == 'P1' and incident.incident_type.name != 'Managed Incident'"
