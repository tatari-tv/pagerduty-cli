# WF4a: Auto-Manage on P1 Escalation
#
# If any non-managed incident gets changed to P1, auto-manage it. Catches the
# case where someone starts at P4 and escalates - they shouldn't have to
# remember to also toggle managed.
#
# Fires on priority change events. P4->P1, P3->P1, P2->P1 all auto-managed.
# WF1 then fires the full response.
#
# Action IDs are placeholders - resolve via: pd action list

workflow:
  name: Auto-Manage on P1 Escalation
  description: Auto-set managed when any incident is changed to P1
  is-enabled: false
  steps:
    - name: Set Incident Type
      action-id: pagerduty.incident-management.update-incident-type
      inputs:
        - name: incident_type
          value: Managed Incident

trigger:
  trigger-type: conditional
  condition: "incident.priority matches 'P1' and incident.incident_type.name != 'Managed Incident'"
