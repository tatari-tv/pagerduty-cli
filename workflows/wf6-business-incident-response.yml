# WF6: Business Incident Response
#
# Full response for Business Incidents (3rd-party data partner outages).
# The root cause is external; Tatari owns impact assessment, communication,
# and the backfill decision.
#
# Roles:
#   IC:  Engineering Manager
#   TL:  Engineer/Manager knowledgeable on the partner/data (Partner Liaison)
#   CL:  CSM or business-side contact (handles client-facing communication)
#
# Partner Liaison (TL) duties: contact partner, determine scope, ETA, backfill.
# CL duties: identify affected clients, draft and send client comms.
#
# Fires when Incident Type = "Business Incident".
#
# Post-import: configure Jira Account in the Create Jira Issue step via PD UI.

workflow:
  name: Business Incident Response
  description: >-
    Full response for Business Incidents: 3rd-party data partner outages.
    Slack channel, Jira INC, partner liaison + client comms coordination.
  is-enabled: false
  steps:
    - name: Create Slack Channel
      action-id: pagerduty.com:slack:create-a-channel:4
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel Name
          value: "business-incident-{{incident.incident_number}}"
        - name: Channel visibility
          value: Public
        - name: Pin incident
          value: "Yes"

    - name: Set Channel Topic
      action-id: pagerduty.com:slack:set-channel-topic:2
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Topic
          value: "Business Incident P{{incident.priority.name}} | {{incident.title}} | IC: TBD | Partner Liaison: TBD | Comms Lead: TBD | Backfill: TBD"

    - name: Post Status Card
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Message
          value: |
            :satellite: *Business Incident Declared* :satellite:

            *Title:* {{incident.title}}
            *Severity:* P{{incident.priority.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *PagerDuty:* {{incident.url}}

            ---

            *Roles - claim yours now:*
            - :helmet_with_white_cross: *Incident Commander:* TBD (Engineering Manager)
            - :wrench: *Partner Liaison (TL):* TBD (Measurement team / Partner Integrations)
            - :mega: *Comms Lead:* TBD (CSM or business-side contact)

            To claim a role, post: `I am [Role] (@yourname)`

            ---

            *Initial Status (fill in as known):*
            ```
            Partner: [name]
            Data affected: [types - commercial_ip / content_ip / streaming impressions / etc.]
            Outage start: [time if known]
            Partner ETA: [unknown / estimate]
            Backfill: [unknown / yes / no / partial]
            Impact assessment: [in progress]
            Next update: [time]
            ```

            ---

            *Immediate Actions:*
            1. *Partner Liaison:* Contact partner now - scope, data types, ETA, backfill availability
            2. *IC:* Confirm severity, loop in DS (Daniel M, Lin, Matt Patch) for impact analysis
            3. *Comms Lead:* Identify affected clients, determine if proactive comms needed

            *Backfill Decision:* IC owns this. Escalate to Mike/Mark/Andy for grey-zone cases.

    - name: Create Jira Issue
      action-id: pagerduty.com:jiracloud:create-jira-cloud-issue:4
      inputs:
        - name: Project
          value: INC
        - name: Issue Type
          value: "Incident (PD)"
        - name: Summary
          value: "[Business] {{incident.title}}"
        - name: Description
          value: |
            *PagerDuty:* {{incident.url}}
            *Priority:* P{{incident.priority.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *Type:* Business Incident
            *Label:* business-incident

    - name: Bookmark - PagerDuty Incident
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: PagerDuty Incident
        - name: Bookmark link
          value: "{{incident.url}}"

    - name: Bookmark - Jira Ticket
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Jira INC Ticket
        - name: Bookmark link
          value: "{{steps['Create Jira Issue'].fields['Jira Issue Link']}}"

    - name: Bookmark - Severity Matrix
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Severity Matrix
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210299922"

    - name: "Post to #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :satellite: *Business Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Slack: #business-incident-{{incident.incident_number}}
            PagerDuty: {{incident.url}}

            Data partner outage in progress. See incident channel for status.

trigger:
  trigger-type: incident_type
  incident-types:
    - Business Incident
