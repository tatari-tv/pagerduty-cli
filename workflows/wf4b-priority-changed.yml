# WF4b: Managed Incident - Priority Changed
#
# When priority changes on a managed incident, post a cadence update to the
# incident channel and #incidents, and refresh the channel topic.
#
# Fires on priority change events for managed incidents only.
#
# KNOWN RACE CONDITION: On a brand-new P1 managed incident, WF1 (creates the
# Slack channel) and WF4b (posts to the channel) may fire simultaneously. If
# WF4b fires before WF1 completes, the dedicated channel may not exist yet and
# the action will fail. Monitor WF4b run logs after enabling.

workflow:
  name: Managed Incident - Priority Changed
  description: Post cadence update to incident channel when priority changes on a managed incident
  is-enabled: false
  steps:
    - name: Post Cadence Update
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Message
          value: |
            :arrows_counterclockwise: *Priority Changed to P{{incident.priority.name}}*

            Please adjust your response cadence:
            - P1: Page 24/7, update every 15 min, IC + Comms Lead must engage immediately
            - P2: Page work hours (incl weekends), update every 30-60 min
            - P3: Slack only, update as needed, next business day urgency
            - P4: Slack only, update as needed, non-urgent

            The incident process continues. Adjust accordingly.

    - name: "Update #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :arrows_counterclockwise: *Priority changed to P{{incident.priority.name}}:* {{incident.title}}
            Slack: #incident-{{incident.incident_number}}

    - name: Update Channel Topic
      action-id: pagerduty.com:slack:set-channel-topic:2
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Topic
          value: "P{{incident.priority.name}} | {{incident.title}} | Service: {{incident.service.name}} | IC: TBD | Tech Lead: TBD | Comms Lead: TBD | Status: Active"

trigger:
  trigger-type: conditional
  condition: "incident.incident_type.name == 'Managed Incident'"
