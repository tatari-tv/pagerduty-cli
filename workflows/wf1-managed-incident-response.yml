# WF1: Managed Incident Response
#
# Full incident response for Managed Incidents. Dedicated Slack channel,
# Jira INC ticket, roles, status updates.
#
# P2-P4 are opt-in: responder or IC sets Incident Type = Managed Incident.
#
# KNOWN GAPS (see https://tatari.atlassian.net/wiki/spaces/INC/pages/2467856408):
#
# 1. JIRA ACCOUNT (post-import manual step)
#    The "Create Jira Issue" step requires a Jira Account connection that cannot
#    be set via workflow import. After importing, open this workflow in PD and
#    configure the Jira Account field manually in the PD UI.
#
# 2. DELAY + STATUS REMINDER NOT INCLUDED
#    PD rejects workflows that combine create-a-channel with a delay action.
#    These steps must be added manually via the PD UI after import.
#
# 3. STATUS CARD IS STATIC - NO SYNC
#    The pinned status card posted to the channel cannot be edited by a PD
#    workflow. Role assignments and status changes made in PD do not update
#    the card. A future webhook service (replacement for tim-old) would handle
#    keeping the card in sync across Slack, Jira, and Confluence.
#
# 4. URGENCY NOT DRIVEN BY PRIORITY FIELD
#    Changing the incident priority (P1->P3 etc.) does not change PD paging
#    behavior. Urgency is determined by which service the alert was routed to
#    at ingest time (constant high for all services currently). See open issue
#    for Terraform changes required to fix initial routing; mid-incident urgency
#    changes require a webhook service or manual step in PD.

workflow:
  name: Managed Incident Response
  description: >-
    Full response for Managed Incidents: Slack channel, Jira INC, roles, status updates
  is-enabled: false
  steps:
    - name: Create Slack Channel
      action-id: pagerduty.com:slack:create-a-channel:4
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel Name
          value: "inc-{{incident.created_at | date: \"%Y%m%d-%H%M\"}}"
        - name: Channel visibility
          value: Public
        - name: Pin incident
          value: "Yes"

    - name: Set Channel Topic
      action-id: pagerduty.com:slack:set-channel-topic:2
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Topic
          value: "P{{incident.priority.name}} | {{incident.title}} | Service: {{incident.service.name}} | IC: TBD | Tech Lead: TBD | Comms Lead: TBD | Status: Active"

    # Pinned to the channel. Cannot be updated by a workflow once posted.
    # Role assignments and priority changes will not update this card automatically.
    - name: Post Status Card
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Pinned message
          value: "Yes"
        - name: Message
          value: |
            :rotating_light: *Managed Incident Declared*

            *Title:* {{incident.title}}
            *Status:* :rotating_light: Triggered
            *Priority:* P{{incident.priority.name}}
            *Service:* {{incident.service.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *PagerDuty:* {{incident.url}}

            ---

            *Roles*
            - :helmet_with_white_cross: *Incident Commander:* TBD - must be an EM. If none claims within 2 min, SRE Manager is IC by default.
            - :wrench: *Tech Lead:* TBD
            - :mega: *Comms Lead:* TBD

            To claim a role, post: `I am [Role] (@yourname)`

            ---

            *Immediate Actions*
            1. *IC:* Confirm or adjust severity. Set comms cadence: P1=15min, P2=30-60min, P3/P4=as needed
            2. *Tech Lead:* Check dashboards, logs, health checks. Report findings every 2-5 min.
            3. *Comms Lead:* Post first status update using the template below.

            *Status Update Template*
            ```
            Current Status:
            - Impact: [description]
            - Affected: [who/what]
            - Actions underway: [what Tech Lead is checking]
            - Next update: [time]
            ```

            *Escalation:* on-call -> secondary (15m) -> manager (30m) -> director (60m) -> VP (90m)

    # KNOWN GAP: Jira Account must be configured manually in PD UI after import.
    - name: Create Jira Issue
      action-id: pagerduty.com:jiracloud:create-jira-cloud-issue:4
      inputs:
        - name: Project
          value: INC
        - name: Issue Type
          value: "Incident (PD)"
        - name: Summary
          value: "{{incident.title}}"
        - name: Description
          value: |
            *PagerDuty:* {{incident.url}}
            *Service:* {{incident.service.name}}
            *Priority:* P{{incident.priority.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}

    - name: Bookmark - PagerDuty Incident
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: PagerDuty Incident
        - name: Bookmark link
          value: "{{incident.url}}"

    - name: Bookmark - Jira Ticket
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Jira INC Ticket
        - name: Bookmark link
          value: "{{steps['Create Jira Issue'].fields['Jira Issue Link']}}"

    - name: Bookmark - Process Doc
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Process Doc
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210562062"

    - name: Bookmark - Severity Matrix
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Severity Matrix
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210299922"

    - name: "Post to #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :rotating_light: *Managed Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Service: {{incident.service.name}}
            Slack: #inc-{{incident.created_at | date: "%Y%m%d-%H%M"}}
            PagerDuty: {{incident.url}}

            Join the incident channel for updates. Do not discuss the incident here.

    # REMOVED: Delay + Status Update Reminder steps.
    # PD rejects workflows that combine create-a-channel with a delay action
    # ("Could not find actions" 404). The delay action is tagged "long-running"
    # and creates a workflow suspension point - channel references from earlier
    # steps cannot be guaranteed when the workflow resumes. These steps need to
    # be configured manually via the PD UI after import, or added via a
    # separate workflow once this PD constraint is better understood.

trigger:
  trigger-type: incident_type
  incident-types:
    - managed_incident
