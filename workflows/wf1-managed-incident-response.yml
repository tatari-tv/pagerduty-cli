# WF1: Incident Response
#
# Full incident response for Managed, Security, and Business incidents.
# Same process for all three types - dedicated Slack channel, Jira INC ticket,
# roles, status updates.
#
# Managed Incidents: P1 gets auto-tagged via WF3. P2-P4 are opt-in.
# Security Incidents: IC is EM or Head of Security; TL is Security Engineer.
# Business Incidents: IC is EM; TL is Partner Liaison; CL is CSM or biz contact.
#
# Post-import: configure Jira Account in the Create Jira Issue step via PD UI.

workflow:
  name: Incident Response
  description: >-
    Full response for Managed, Security, and Business incidents: Slack channel,
    Jira INC, roles, status updates
  is-enabled: false
  steps:
    - name: Create Slack Channel
      action-id: pagerduty.com:slack:create-a-channel:4
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel Name
          value: "incident-{{incident.incident_number}}"
        - name: Channel visibility
          value: Public
        - name: Pin incident
          value: "Yes"

    - name: Set Channel Topic
      action-id: pagerduty.com:slack:set-channel-topic:2
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Topic
          value: "P{{incident.priority.name}} | {{incident.title}} | Service: {{incident.service.name}} | IC: TBD | Tech Lead: TBD | Comms Lead: TBD | Status: Active"

    - name: Post Status Card
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Message
          value: |
            :rotating_light: *Managed Incident Declared* :rotating_light:

            *Title:* {{incident.title}}
            *Severity:* P{{incident.priority.name}}
            *Service:* {{incident.service.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *PagerDuty:* {{incident.url}}

            ---

            *Roles - claim yours now:*
            - :helmet_with_white_cross: *Incident Commander:* TBD (must be EM - if none in 2 min, SRE Manager is IC)
            - :wrench: *Tech Lead:* TBD
            - :mega: *Comms Lead:* TBD

            To claim a role, post: `I am [Role] (@yourname)`

            ---

            *Immediate Actions:*
            1. IC: Confirm or adjust severity
            2. Tech Lead: Check dashboards, logs, health checks
            3. Comms Lead: Post first status update

            *Status Update Template:*
            ```
            Current Status:
            - Impact: [description]
            - Actions underway: [what Tech Lead is doing]
            - Next update: [time]
            ```

            *Escalation Chain:* on-call -> secondary (15m) -> manager (30m) -> director (60m) -> VP (90m)

    - name: Create Jira Issue
      action-id: pagerduty.com:jiracloud:create-jira-cloud-issue:4
      inputs:
        - name: Project
          value: INC
        - name: Issue Type
          value: "Incident (PD)"
        - name: Summary
          value: "{{incident.title}}"
        - name: Description
          value: |
            *PagerDuty:* {{incident.url}}
            *Service:* {{incident.service.name}}
            *Priority:* P{{incident.priority.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}

    - name: Bookmark - PagerDuty Incident
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: PagerDuty Incident
        - name: Bookmark link
          value: "{{incident.url}}"

    - name: Bookmark - Jira Ticket
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Jira INC Ticket
        - name: Bookmark link
          value: "{{steps['Create Jira Issue'].fields['Jira Issue Link']}}"

    - name: Bookmark - Process Doc
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Process Doc
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210562062"

    - name: Bookmark - Severity Matrix
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Severity Matrix
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210299922"

    - name: "Post to #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :rotating_light: *Managed Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Service: {{incident.service.name}}
            Slack: #incident-{{incident.incident_number}}
            PagerDuty: {{incident.url}}

            Join the incident channel for updates. Do not discuss the incident here.

    - name: Delay Before Status Prompt
      action-id: pagerduty.com:incident-workflows:delay:1
      inputs:
        - name: Delay Period
          value: "15"

    - name: Status Update Prompt
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Message
          value: |
            :clock3: *Status Update Due*

            Comms Lead - please post a status update now:

            ```
            Current Status:
            - Impact: [current state]
            - Progress: [what changed]
            - Risks: [any concerns]
            - Next update: [time]
            ```

            If no Comms Lead assigned, IC owns this update.

trigger:
  trigger-type: incident_type
  incident-types:
    - Managed Incident
    - Security Incident
    - Business Incident
