# WF3: Auto-Manage P1
#
# Every P1 incident is automatically a managed incident. No human has to
# remember to toggle Incident Type. P1 -> managed=true -> WF1 fires.

workflow:
  name: Auto-Manage P1
  description: Automatically set Incident Type to Managed Incident for all P1 incidents
  is-enabled: false
  steps:
    - name: Set Incident Type
      action-id: pagerduty.com:incident-workflows:update-incident-type:1
      inputs:
        - name: Incident Type
          value: Managed Incident

trigger:
  trigger-type: conditional
  condition: "incident.priority.name == 'P1'"
