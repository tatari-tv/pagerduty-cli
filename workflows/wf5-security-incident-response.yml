# WF5: Security Incident Response
#
# Full response for Security Incidents. Structurally identical to WF1 but
# with a security-specific status card and Jira description.
#
# IC is Engineering Manager or Head of Security depending on threat nature.
# TL is a Security Engineer.
#
# Fires when Incident Type = "Security Incident".
#
# Post-import: configure Jira Account in the Create Jira Issue step via PD UI.

workflow:
  name: Security Incident Response
  description: >-
    Full response for Security Incidents: Slack channel, Jira INC,
    IC/TL/CL roles, status updates
  is-enabled: false
  steps:
    - name: Create Slack Channel
      action-id: pagerduty.com:slack:create-a-channel:4
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel Name
          value: "security-incident-{{incident.incident_number}}"
        - name: Channel visibility
          value: Public
        - name: Pin incident
          value: "Yes"

    - name: Set Channel Topic
      action-id: pagerduty.com:slack:set-channel-topic:2
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Topic
          value: "Security Incident P{{incident.priority.name}} | {{incident.title}} | Service: {{incident.service.name}} | IC: TBD | Tech Lead: TBD | Comms Lead: TBD | Status: Active"

    - name: Post Status Card
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Message
          value: |
            :lock: *Security Incident Declared* :lock:

            *Title:* {{incident.title}}
            *Severity:* P{{incident.priority.name}}
            *Service:* {{incident.service.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *PagerDuty:* {{incident.url}}

            ---

            *Roles - claim yours now:*
            - :helmet_with_white_cross: *Incident Commander:* TBD (EM or Head of Security)
            - :wrench: *Tech Lead:* TBD (Security Engineer)
            - :mega: *Comms Lead:* TBD

            To claim a role, post: `I am [Role] (@yourname)`

            ---

            *Immediate Actions:*
            1. IC: Confirm severity and scope of the security threat
            2. Tech Lead: Investigate - what is affected, what data is at risk, how did it happen
            3. Comms Lead: Post first status update; limit detail to this channel only

            *Do not discuss findings in public channels. Keep all investigation in this channel.*

    - name: Create Jira Issue
      action-id: pagerduty.com:jiracloud:create-jira-cloud-issue:4
      inputs:
        - name: Project
          value: INC
        - name: Issue Type
          value: "Incident (PD)"
        - name: Summary
          value: "[Security] {{incident.title}}"
        - name: Description
          value: |
            *PagerDuty:* {{incident.url}}
            *Service:* {{incident.service.name}}
            *Priority:* P{{incident.priority.name}}
            *Triggered:* {{incident.created_at | date: "%Y-%m-%d %H:%M %Z"}}
            *Type:* Security Incident

    - name: Bookmark - PagerDuty Incident
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: PagerDuty Incident
        - name: Bookmark link
          value: "{{incident.url}}"

    - name: Bookmark - Jira Ticket
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Jira INC Ticket
        - name: Bookmark link
          value: "{{steps['Create Jira Issue'].fields['Jira Issue Link']}}"

    - name: Bookmark - Severity Matrix
      action-id: pagerduty.com:slack:add-a-bookmark:1
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: Incident Dedicated Channel
        - name: Bookmark name
          value: Severity Matrix
        - name: Bookmark link
          value: "https://tatari.atlassian.net/wiki/spaces/INC/pages/2210299922"

    - name: "Post to #incidents"
      action-id: pagerduty.com:slack:send-markdown-message:3
      inputs:
        - name: Workspace
          value: T0KB86ZEU
        - name: Channel
          value: A specific channel
        - name: Select the Channel
          value: incidents
        - name: Message
          value: |
            :lock: *Security Incident - P{{incident.priority.name}}*

            *{{incident.title}}*
            Service: {{incident.service.name}}
            Slack: #security-incident-{{incident.incident_number}}
            PagerDuty: {{incident.url}}

            Security team is responding. Join the incident channel for updates.

trigger:
  trigger-type: incident_type
  incident-types:
    - Security Incident
